name: Update README Assets

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # Job 1: Neofetch / Terminal Stats SVG
  # ─────────────────────────────────────────
  terminal-stats:
    name: 💻 Generate Terminal Stats SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate dark mode SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_terminal_svg.py --mode dark

      - name: Generate light mode SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_terminal_svg.py --mode light

      - uses: actions/upload-artifact@v4
        with:
          name: terminal-svgs
          path: assets/*.svg

  # ─────────────────────────────────────────
  # Job 2: Contribution Heatmap (terminal style)
  # ─────────────────────────────────────────
  heatmap:
    name: 🔥 Generate Contribution Heatmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate heatmap SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_heatmap.py

      - uses: actions/upload-artifact@v4
        with:
          name: heatmap-svgs
          path: assets/*.svg

  # ─────────────────────────────────────────
  # Job 3: 3D Tech Stack SVG
  # ─────────────────────────────────────────
  techstack:
    name: 🎹 Generate 3D Tech Stack SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate 3D keycap SVG
        run: python scripts/generate_techstack_svg.py

      - uses: actions/upload-artifact@v4
        with:
          name: techstack-svg
          path: assets/techstack-3d-dark.svg

  # ─────────────────────────────────────────
  # Job 4: Commit all generated assets
  # ─────────────────────────────────────────
  commit-assets:
    name: 📦 Commit All Assets
    needs: [terminal-stats, heatmap, techstack]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download terminal SVGs
        uses: actions/download-artifact@v4
        with:
          name: terminal-svgs
          path: assets/

      - name: Download heatmap SVGs
        uses: actions/download-artifact@v4
        with:
          name: heatmap-svgs
          path: assets/

      - name: Download techstack SVG
        uses: actions/download-artifact@v4
        with:
          name: techstack-svg
          path: assets/

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: auto-update readme assets [skip ci]"
          git push
