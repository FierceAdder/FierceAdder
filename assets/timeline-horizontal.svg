<svg xmlns="http://www.w3.org/2000/svg" width="860" height="265" viewBox="0 0 860 265">
  <defs>
    <linearGradient id="axisGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A371F7;stop-opacity:1" />
    </linearGradient>

    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-3px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .milestone-tata {
        animation: fadeIn 0.45s ease forwards;
      }
      .milestone-rtifact {
        animation: fadeIn 0.45s ease forwards;
        animation-delay: 0.15s;
        opacity: 0;
      }
    </style>
  </defs>

  <!-- Terminal Window Chrome -->
  <rect width="860" height="265" rx="10" fill="#0D1117" />
  <rect width="858" height="263" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2" />

  <circle cx="22" cy="20" r="5.5" fill="#FF5F56" />
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E" />
  <circle cx="56" cy="20" r="5.5" fill="#28C840" />

  <text x="430" y="24" class="mono" font-size="12" fill="#8B949E" text-anchor="middle">
    $ cat experience.json | jq '.[]'
  </text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1" />

  <!-- Timeline Axis -->
  <line x1="40" y1="66" x2="820" y2="66" stroke="#21262D" stroke-width="3" stroke-linecap="round" />
  <line x1="40" y1="66" x2="820" y2="66" stroke="url(#axisGradient)" stroke-width="3" stroke-linecap="round" />
  <polygon points="820,66 810,61.5 810,70.5" fill="#A371F7" />

  <!-- ═══════════════════════════════════════
       MILESTONE 1 — TATA COMMUNICATIONS
       x-center: 230, Card: 360px wide
       ═══════════════════════════════════════ -->
  <g class="milestone-tata">
    <!-- Date pill above axis -->
    <rect x="155" y="40" width="150" height="18" rx="9"
          fill="#58A6FF" fill-opacity="0.15"
          stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="230" y="52.5" class="mono" font-size="9" font-weight="700" fill="#58A6FF" text-anchor="middle">
      AUG 2025 — SEP 2025
    </text>

    <!-- Node on axis -->
    <circle cx="230" cy="66" r="9" fill="none" stroke="#58A6FF" stroke-width="2" filter="url(#glowBlue)" />
    <circle cx="230" cy="66" r="4" fill="#58A6FF" />

    <!-- Card below axis -->
    <rect x="50" y="84" width="360" height="165" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Header bar -->
    <rect x="50" y="84" width="360" height="36" rx="8" fill="#0D1117" />
    <rect x="50" y="106" width="360" height="14" fill="#0D1117" />
    <line x1="50" y1="120" x2="410" y2="120" stroke="#21262D" stroke-width="1" />

    <!-- Role Title on top line -->
    <text x="64" y="102" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">
      📡 Project Trainee
    </text>
    <!-- Company & Location on clear subtitle line -->
    <text x="64" y="115" class="mono" font-size="9.5" fill="#58A6FF" font-weight="600">
      Tata Communications <tspan fill="#8B949E">· Pune, India</tspan>
    </text>

    <!-- Bullets -->
    <g transform="translate(64, 137)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#58A6FF">▸</text>
      <text x="12" y="0" class="mono" font-size="9" fill="#C9D1D9">
        Designed RESTful endpoints for Automated Incident Mgmt System
      </text>

      <text x="0" y="22" class="mono" font-size="9.5" fill="#58A6FF">▸</text>
      <text x="12" y="22" class="mono" font-size="9" fill="#C9D1D9">
        Integrated New Relic alerts with ServiceNow (ingestion &amp; sync)
      </text>

      <text x="0" y="44" class="mono" font-size="9.5" fill="#58A6FF">▸</text>
      <text x="12" y="44" class="mono" font-size="9" fill="#C9D1D9">
        Reported deployment readiness &amp; performance telemetry to lead
      </text>

      <text x="0" y="66" class="mono" font-size="9.5" fill="#58A6FF">▸</text>
      <text x="12" y="66" class="mono" font-size="9" fill="#C9D1D9">
        Positioned to reduce NOC triage staffing from <tspan fill="#3FB950" font-weight="700">5 engineers → 1</tspan>
      </text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════
       MILESTONE 2 — RTIFACT
       x-center: 630, Card: 360px wide
       ═══════════════════════════════════════ -->
  <g class="milestone-rtifact">
    <!-- Date pill above axis -->
    <rect x="555" y="40" width="150" height="18" rx="9"
          fill="#A371F7" fill-opacity="0.15"
          stroke="#A371F7" stroke-width="0.8" stroke-opacity="0.6" />
    <text x="630" y="52.5" class="mono" font-size="9" font-weight="700" fill="#A371F7" text-anchor="middle">
      JUL 2026 — SEP 2026
    </text>

    <!-- Node on axis -->
    <circle cx="630" cy="66" r="9" fill="none" stroke="#A371F7" stroke-width="2" filter="url(#glowPurple)" />
    <circle cx="630" cy="66" r="4" fill="#A371F7" />

    <!-- Card below axis -->
    <rect x="450" y="84" width="360" height="165" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Header bar -->
    <rect x="450" y="84" width="360" height="36" rx="8" fill="#0D1117" />
    <rect x="450" y="106" width="360" height="14" fill="#0D1117" />
    <line x1="450" y1="120" x2="810" y2="120" stroke="#21262D" stroke-width="1" />

    <!-- Role Title on top line -->
    <text x="464" y="102" class="mono" font-size="12" font-weight="700" fill="#FFFFFF">
      🤖 AI Engineer Intern
    </text>
    <!-- Company & Location on clear subtitle line (ZERO COLLISION!) -->
    <text x="464" y="115" class="mono" font-size="9.5" fill="#A371F7" font-weight="600">
      Rtifact <tspan fill="#8B949E">· Remote / Bengaluru</tspan>
    </text>

    <!-- Bullets -->
    <g transform="translate(464, 137)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#A371F7">▸</text>
      <text x="12" y="0" class="mono" font-size="9" fill="#C9D1D9">
        GitHub issue grounding: <tspan fill="#A371F7" font-weight="700">11,600+ nodes</tspan> @ 70ms warm latency
      </text>

      <text x="0" y="22" class="mono" font-size="9.5" fill="#A371F7">▸</text>
      <text x="12" y="22" class="mono" font-size="9" fill="#C9D1D9">
        GraphRAG NLQ over 50 Cypher templates in <tspan fill="#3FB950" font-weight="700">&lt;30ms</tspan> at zero LLM cost
      </text>

      <text x="0" y="44" class="mono" font-size="9.5" fill="#A371F7">▸</text>
      <text x="12" y="44" class="mono" font-size="9" fill="#C9D1D9">
        AWS asset cartography: EC2/S3/RDS/Lambda in <tspan fill="#58A6FF" font-weight="700">&lt;185ms</tspan> per event
      </text>

      <text x="0" y="66" class="mono" font-size="9.5" fill="#A371F7">▸</text>
      <text x="12" y="66" class="mono" font-size="9" fill="#C9D1D9">
        5-pass extraction: Tree-sitter AST (37 langs) + OpenAI enrichment
      </text>
    </g>
  </g>
</svg>
