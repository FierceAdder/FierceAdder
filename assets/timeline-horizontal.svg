<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950" />
      <stop offset="100%" stop-color="#A371F7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace; }
  </style>

  <rect width="860" height="310" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />

  <!-- Timeline axis -->
  <line x1="60" y1="44" x2="780" y2="44" stroke="#21262D" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="44" x2="770" y2="44" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <polygon points="782,44 770,39 770,49" fill="#A371F7" />

  <!-- Node 1: Tata -->
  <g>
    <rect x="135" y="14" width="160" height="20" rx="10" fill="#162F1E" stroke="#3FB950" stroke-width="0.8" />
    <text x="215" y="27.5" class="font-mono" font-size="9" font-weight="700" fill="#3FB950" text-anchor="middle">AUG 2025 — SEP 2025</text>
    <circle cx="215" cy="44" r="7" fill="#0D1117" stroke="#3FB950" stroke-width="2.5" />
    <circle cx="215" cy="44" r="3" fill="#3FB950" />
  </g>

  <!-- Node 2: Rtifact -->
  <g>
    <rect x="565" y="14" width="160" height="20" rx="10" fill="#2E1B4E" stroke="#A371F7" stroke-width="0.8" />
    <text x="645" y="27.5" class="font-mono" font-size="9" font-weight="700" fill="#A371F7" text-anchor="middle">JUL 2026 — SEP 2026</text>
    <circle cx="645" cy="44" r="7" fill="#0D1117" stroke="#A371F7" stroke-width="2.5" />
    <circle cx="645" cy="44" r="3" fill="#A371F7" />
  </g>

  <!-- Card 1: Tata Communications -->
  <g>
    <rect x="24" y="66" width="385" height="228" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="42" y="90"  class="font-mono" font-size="12" font-weight="700" fill="#FFFFFF">📡 Project Trainee</text>
    <text x="42" y="106" class="font-mono" font-size="9.5" font-weight="600" fill="#3FB950">Tata Communications · Pune</text>
    <line x1="42" y1="114" x2="391" y2="114" stroke="#21262D" stroke-width="1" />

    <text x="42" y="134" class="font-mono" font-size="9" fill="#8B949E">Built AIMS — automated New Relic → ServiceNow</text>
    <text x="42" y="150" class="font-mono" font-size="9" fill="#8B949E">incident pipeline with deduplication &amp; SLA audits.</text>

    <text x="42" y="175" class="font-mono" font-size="9" fill="#8B949E">Reduced NOC triage staffing from</text>
    <text x="42" y="191" class="font-mono" font-size="9" font-weight="700" fill="#3FB950">5 engineers → 1 on full deployment.</text>

    <text x="42" y="216" class="font-mono" font-size="8.5" fill="#484F58">FastAPI · New Relic · ServiceNow · REST</text>
  </g>

  <!-- Card 2: Rtifact -->
  <g>
    <rect x="425" y="66" width="415" height="228" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <text x="443" y="90"  class="font-mono" font-size="12" font-weight="700" fill="#FFFFFF">🤖 AI Engineer Intern</text>
    <text x="443" y="106" class="font-mono" font-size="9.5" font-weight="600" fill="#A371F7">Rtifact · Remote / Bengaluru</text>
    <line x1="443" y1="114" x2="822" y2="114" stroke="#21262D" stroke-width="1" />

    <text x="443" y="134" class="font-mono" font-size="9" fill="#8B949E">Issue-grounding engine: maps stack traces to</text>
    <text x="443" y="150" class="font-mono" font-size="9" font-weight="700" fill="#3FB950">file:fn:line at 70ms · 0.95 confidence.</text>

    <text x="443" y="171" class="font-mono" font-size="9" fill="#8B949E">Graph index: 11,600+ nodes, 23,700+ edges.</text>
    <text x="443" y="187" class="font-mono" font-size="9" fill="#8B949E">Tree-sitter AST across 37 langs · GraphRAG NLQ</text>
    <text x="443" y="203" class="font-mono" font-size="9" font-weight="700" fill="#3FB950">in &lt;30ms at zero LLM cost.</text>

    <text x="443" y="228" class="font-mono" font-size="8.5" fill="#484F58">FastAPI · Neo4j · LangChain · FAISS · AWS · Tree-sitter</text>
  </g>
</svg>
