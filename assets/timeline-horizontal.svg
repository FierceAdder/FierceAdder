<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
  <defs>
    <!-- Gradient for timeline axis -->
    <linearGradient id="axisGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A371F7;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter for Tata node -->
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow filter for Rtifact node -->
    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Semi-transparent fills for date pills -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');

      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      }

      /* Fade-in animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .milestone-tata {
        animation: fadeIn 0.5s ease forwards;
        animation-delay: 0s;
        opacity: 0;
      }

      .milestone-rtifact {
        animation: fadeIn 0.5s ease forwards;
        animation-delay: 0.3s;
        opacity: 0;
      }
    </style>
  </defs>

  <!-- ═══════════════════════════════════════ -->
  <!--  TERMINAL CHROME                        -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Background -->
  <rect width="860" height="230" rx="10" fill="#0D1117" />
  <!-- Border -->
  <rect width="858" height="228" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2" />

  <!-- macOS traffic-light dots -->
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56" />
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E" />
  <circle cx="56" cy="20" r="5.5" fill="#28C840" />

  <!-- Title bar text -->
  <text x="430" y="24"
        font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
        font-size="12" fill="#8B949E" text-anchor="middle">
    $ cat experience.json | jq '.[]'
  </text>

  <!-- Header divider line -->
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1" />

  <!-- ═══════════════════════════════════════ -->
  <!--  TIMELINE AXIS                          -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Background dim line -->
  <line x1="50" y1="70" x2="810" y2="70" stroke="#21262D" stroke-width="3" stroke-linecap="round" />

  <!-- Gradient overlay line -->
  <line x1="50" y1="70" x2="810" y2="70"
        stroke="url(#axisGradient)" stroke-width="3" stroke-linecap="round" />

  <!-- Arrow tip at right end -->
  <polygon points="810,70 800,65.5 800,74.5" fill="#A371F7" />

  <!-- ═══════════════════════════════════════ -->
  <!--  MILESTONE 1 — TATA COMMUNICATIONS      -->
  <!--  x-center: 215, color: #58A6FF (blue)  -->
  <!-- ═══════════════════════════════════════ -->
  <g class="milestone-tata">

    <!-- Date pill above axis -->
    <rect x="150" y="43" width="130" height="16" rx="8"
          fill="#58A6FF" fill-opacity="0.15"
          stroke="#58A6FF" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="215" y="54.5"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9" font-weight="700" fill="#58A6FF" text-anchor="middle">
      AUG 2025 — SEP 2025
    </text>

    <!-- Node on axis — outer ring -->
    <circle cx="215" cy="70" r="9" fill="none" stroke="#58A6FF" stroke-width="2"
            filter="url(#glowBlue)" />
    <!-- Node on axis — inner filled dot -->
    <circle cx="215" cy="70" r="4" fill="#58A6FF" />

    <!-- Card below axis -->
    <rect x="110" y="85" width="210" height="128" rx="7"
          fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Card title -->
    <text x="215" y="101"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      📡 Project Trainee
    </text>

    <!-- Company -->
    <text x="215" y="116"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="11" font-weight="600" fill="#58A6FF" text-anchor="middle">
      Tata Communications
    </text>

    <!-- Location -->
    <text x="215" y="129"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="10" fill="#8B949E" text-anchor="middle">
      Pune, India
    </text>

    <!-- Bullet separator -->
    <line x1="125" y1="136" x2="305" y2="136" stroke="#30363D" stroke-width="0.6" />

    <!-- Bullet 1 -->
    <text x="122" y="149"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#58A6FF">•</text>
    <text x="133" y="149"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      Designed RESTful endpoints for
    </text>
    <text x="133" y="161"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      Automated Incident Mgmt System
    </text>

    <!-- Bullet 2 -->
    <text x="122" y="174"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#58A6FF">•</text>
    <text x="133" y="174"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      Integrated New Relic alerts →
    </text>
    <text x="133" y="186"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      ServiceNow (ingest, dedup, sync)
    </text>

    <!-- Bullet 3 -->
    <text x="122" y="200"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#58A6FF">•</text>
    <text x="133" y="200"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      NOC triage: 5 engineers → 1
    </text>

  </g>

  <!-- ═══════════════════════════════════════ -->
  <!--  MILESTONE 2 — RTIFACT                  -->
  <!--  x-center: 645, color: #A371F7 (purple) -->
  <!-- ═══════════════════════════════════════ -->
  <g class="milestone-rtifact">

    <!-- Date pill above axis -->
    <rect x="577" y="43" width="136" height="16" rx="8"
          fill="#A371F7" fill-opacity="0.15"
          stroke="#A371F7" stroke-width="0.8" stroke-opacity="0.5" />
    <text x="645" y="54.5"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9" font-weight="700" fill="#A371F7" text-anchor="middle">
      JUL 2026 — SEP 2026
    </text>

    <!-- Node on axis — outer ring -->
    <circle cx="645" cy="70" r="9" fill="none" stroke="#A371F7" stroke-width="2"
            filter="url(#glowPurple)" />
    <!-- Node on axis — inner filled dot -->
    <circle cx="645" cy="70" r="4" fill="#A371F7" />

    <!-- Card below axis — wider to fit 4 bullets -->
    <rect x="530" y="85" width="230" height="135" rx="7"
          fill="#161B22" stroke="#30363D" stroke-width="1" />

    <!-- Card title -->
    <text x="645" y="101"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      🤖 AI Engineer Intern
    </text>

    <!-- Company -->
    <text x="645" y="116"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="11" font-weight="600" fill="#A371F7" text-anchor="middle">
      Rtifact
    </text>

    <!-- Location -->
    <text x="645" y="129"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="10" fill="#8B949E" text-anchor="middle">
      Remote / Bengaluru
    </text>

    <!-- Bullet separator -->
    <line x1="545" y1="136" x2="745" y2="136" stroke="#30363D" stroke-width="0.6" />

    <!-- Bullet 1 -->
    <text x="537" y="149"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#A371F7">•</text>
    <text x="548" y="149"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      GitHub issue grounding: 11,600+ nodes,
    </text>
    <text x="548" y="160"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      70ms latency
    </text>

    <!-- Bullet 2 -->
    <text x="537" y="172"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#A371F7">•</text>
    <text x="548" y="172"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      GraphRAG NLQ: 50 Cypher templates,
    </text>
    <text x="548" y="183"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      &lt;30ms, zero LLM cost
    </text>

    <!-- Bullet 3 -->
    <text x="537" y="195"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#A371F7">•</text>
    <text x="548" y="195"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      AWS cartography: EC2/S3/RDS/Lambda
    </text>
    <text x="548" y="206"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      &lt;185ms per event
    </text>

    <!-- Bullet 4 -->
    <text x="537" y="217"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#A371F7">•</text>
    <text x="548" y="217"
          font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
          font-size="9.5" fill="#8B949E">
      Tree-sitter AST (37 langs) + OpenAI
    </text>

  </g>

</svg>
