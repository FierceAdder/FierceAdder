    <text x="452" y="240" class="lbl" font-size="8.5" fill="#FF7B72">⎋  github.com/FierceAdder/SENTINEL</text>
  </g>

  <g class="card c2">
    <rect x="24" y="260" width="396" height="180" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
