    <text x="36" y="353" class="lbl" font-size="9" fill="#3FB950">▸</text>
    <text x="48" y="353" class="lbl" font-size="9" fill="#C9D1D9">Autonomous AR agent with <tspan fill="#3FB950" font-weight="700">P(recovery)</tspan> probability modeling</text>
    <text x="36" y="368" class="lbl" font-size="9" fill="#3FB950">▸</text>
    <text x="48" y="368" class="lbl" font-size="9" fill="#C9D1D9">Deterministic policy gating (L0–L6) + Redis thread approval</text>
