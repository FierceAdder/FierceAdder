    <!-- Subtitle -->
    <text x="28" y="118" class="lbl" font-size="9.5" fill="#8B949E">NSE/BSE Paper Trading · AI Signal Classifier · RAG Chatbot</text>
    <!-- Stack row -->
    <rect x="28" y="128" width="384" height="22" rx="5" fill="#0D1117" opacity="0.6"/>
    <text x="34" y="143" class="lbl" font-size="8.5" fill="#58A6FF">React</text>
    <text x="66" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="76" y="143" class="lbl" font-size="8.5" fill="#3FB950">FastAPI</text>
    <text x="118" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="128" y="143" class="lbl" font-size="8.5" fill="#A371F7">XGBoost</text>
    <text x="178" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="188" y="143" class="lbl" font-size="8.5" fill="#E3B341">FinBERT</text>
    <text x="232" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="242" y="143" class="lbl" font-size="8.5" fill="#58A6FF">pgvector</text>
    <text x="291" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="301" y="143" class="lbl" font-size="8.5" fill="#FF7B72">Docker</text>
    <!-- Bullets -->
    <text x="28" y="167" class="lbl" font-size="9" fill="#3FB950">▸</text>
    <text x="40" y="167" class="lbl" font-size="9" fill="#C9D1D9">XGBoost BUY/HOLD/SELL · <tspan fill="#58A6FF">52.8%</tspan> precision vs 33% random</text>
    <text x="28" y="183" class="lbl" font-size="9" fill="#3FB950">▸</text>
    <text x="40" y="183" class="lbl" font-size="9" fill="#C9D1D9">RAG chatbot (Gemini + pgvector) · real-time WebSocket leaderboard</text>
    <text x="28" y="199" class="lbl" font-size="9" fill="#3FB950">▸</text>
    <text x="40" y="199" class="lbl" font-size="9" fill="#C9D1D9">Microservices · Nginx reverse proxy · <tspan fill="#3FB950">GitHub Actions CI/CD</tspan></text>
    <!-- Footer link -->
    <line x1="20" y1="244" x2="420" y2="244" stroke="#21262D" stroke-width="1"/>
    <text x="34" y="254" class="lbl" font-size="9" fill="#58A6FF">⎋  github.com/FierceAdder/FinSocial</text>
  </g>

