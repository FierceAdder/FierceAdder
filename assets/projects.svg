<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480">
  <defs>
    <style>
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes borderPulse {
        0%,100% { opacity: 0.6; }
        50%      { opacity: 1.0; }
      }
      @keyframes typeIn {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0); }
      }
      @keyframes blink {
        0%,100% { opacity: 1; } 50% { opacity: 0; }
      }
      .lbl { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .card { animation: slideUp 0.55s ease both; }
      .c0 { animation-delay: 0.05s; }
      .c1 { animation-delay: 0.20s; }
      .c2 { animation-delay: 0.35s; }
      .c3 { animation-delay: 0.50s; }
      .border-anim { animation: borderPulse 3s ease-in-out infinite; }
    </style>
    <filter id="cardGlow" x="-8%" y="-8%" width="116%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="hdr" x="-5%" y="-20%" width="110%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" rx="10" fill="#0D1117"/>
  <rect width="858" height="478" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="20" r="5.5" fill="#28C840"/>
  <text x="430" y="24" class="lbl" font-size="12" fill="#8B949E" text-anchor="middle">projects.db — $ ls -la ./projects/</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1"/>

  <!-- Prompt -->
  <text x="22" y="55" class="lbl" font-size="11" fill="#58A6FF" font-weight="600">FierceAdder@github</text>
  <text x="184" y="55" class="lbl" font-size="11" fill="#8B949E">:~/projects$</text>
  <text x="264" y="55" class="lbl" font-size="11" fill="#3FB950" font-weight="600"> ls --details</text>
  <rect x="366" y="44" width="7" height="13" rx="1" fill="#3FB950" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0;0.75" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══════════════════════════════════════
       CARD 1 — FinSocial  (top-left, blue)
       ═══════════════════════════════════════ -->
  <g class="card c0">
    <!-- Glow border -->
    <rect x="20" y="66" width="400" height="192" rx="10" fill="#58A6FF" opacity="0.08" class="border-anim" filter="url(#cardGlow)"/>
    <!-- Card body -->
    <rect x="20" y="66" width="400" height="192" rx="10" fill="#161B22" stroke="#58A6FF" stroke-width="1.2"/>
    <!-- Header bar -->
    <rect x="20" y="66" width="400" height="38" rx="10" fill="#1a2a3a"/>
    <rect x="20" y="88" width="400" height="16" fill="#1a2a3a"/>
    <!-- Header dots -->
    <circle cx="38" cy="85" r="4" fill="#FF5F56" opacity="0.8"/>
    <circle cx="52" cy="85" r="4" fill="#FEBC2E" opacity="0.8"/>
    <circle cx="66" cy="85" r="4" fill="#28C840" opacity="0.8"/>
    <!-- Badge -->
