    <rect x="440" y="260" width="396" height="34" rx="8" fill="#0D1117"/>
    <rect x="440" y="282" width="396" height="12" fill="#0D1117"/>
    <line x1="440" y1="294" x2="836" y2="294" stroke="#21262D" stroke-width="1"/>
