    <text x="48" y="383" class="lbl" font-size="9" fill="#C9D1D9">Razorpay Payment Links + HMAC-SHA256 webhook settlement</text>
    <line x1="24" y1="420" x2="420" y2="420" stroke="#21262D" stroke-width="1"/>
    <text x="36" y="432" class="lbl" font-size="8.5" fill="#3FB950">⎋  github.com/FierceAdder/RevBack</text>
