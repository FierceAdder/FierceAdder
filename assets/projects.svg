    <text x="460" y="199" class="lbl" font-size="9" fill="#C9D1D9">Sub-10ms TF-IDF/LR for prompt-injection · <tspan fill="#3FB950">60–95%</tspan> context compression</text>
    <line x1="440" y1="244" x2="840" y2="244" stroke="#21262D" stroke-width="1"/>
    <text x="454" y="254" class="lbl" font-size="9" fill="#FF7B72">⎋  github.com/FierceAdder/SENTINEL</text>
  </g>

