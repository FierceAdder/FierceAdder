<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460">
  <defs>
    <style>
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .lbl { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .card { animation: slideUp 0.4s ease both; }
      .c0 { animation-delay: 0.05s; }
      .c1 { animation-delay: 0.15s; }
      .c2 { animation-delay: 0.25s; }
      .c3 { animation-delay: 0.35s; }
    </style>
  </defs>

  <!-- Terminal Window Chrome -->
  <rect width="860" height="460" rx="10" fill="#0D1117"/>
  <rect width="858" height="458" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="20" r="5.5" fill="#28C840"/>
  <text x="430" y="24" class="lbl" font-size="12" fill="#8B949E" text-anchor="middle">projects.db — $ ls -la ./projects/</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1"/>

  <!-- Prompt Command -->
  <text x="24" y="55" class="lbl" font-size="11" fill="#58A6FF" font-weight="600">FierceAdder@github</text>
  <text x="186" y="55" class="lbl" font-size="11" fill="#8B949E">:~/projects$</text>
  <text x="266" y="55" class="lbl" font-size="11" fill="#3FB950" font-weight="600">ls --featured</text>

  <g class="card c0">
    <rect x="24" y="68" width="396" height="180" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Card top header bar -->
    <rect x="24" y="68" width="396" height="34" rx="8" fill="#0D1117"/>
    <rect x="24" y="90" width="396" height="12" fill="#0D1117"/>
    <line x1="24" y1="102" x2="420" y2="102" stroke="#21262D" stroke-width="1"/>
    <!-- Dots -->
    <circle cx="40" cy="85" r="3.5" fill="#FF5F56" opacity="0.6"/>
    <circle cx="52" cy="85" r="3.5" fill="#FEBC2E" opacity="0.6"/>
    <circle cx="64" cy="85" r="3.5" fill="#28C840" opacity="0.6"/>
    <!-- Title -->
    <text x="80" y="89" class="lbl" font-size="12.5" font-weight="700" fill="#FFFFFF">📈 FinSocial</text>
    <!-- Badge -->
    <rect x="312" y="76" width="98" height="18" rx="4" fill="#1F2D40" stroke="#58A6FF" stroke-width="0.8"/>
    <text x="361" y="88.5" class="lbl" font-size="8" fill="#58A6FF" text-anchor="middle" font-weight="700">PAPER TRADING</text>
    <!-- Subtitle -->
    <text x="36" y="119" class="lbl" font-size="9" fill="#8B949E">NSE/BSE Social Trading · AI Classifier · RAG Chatbot</text>
    <!-- Tech stack strip -->
    <rect x="36" y="126" width="372" height="20" rx="4" fill="#0D1117"/>
    <text x="44" y="139.5" class="lbl" font-size="8.5" fill="#58A6FF">React · FastAPI · XGBoost · FinBERT · pgvector · Docker</text>
    <!-- Bullets -->
    <text x="36" y="161" class="lbl" font-size="9" fill="#58A6FF">▸</text>
    <text x="48" y="161" class="lbl" font-size="9" fill="#C9D1D9">XGBoost BUY/HOLD/SELL: <tspan fill="#58A6FF" font-weight="700">52.8%</tspan> precision vs 33% baseline</text>
    <text x="36" y="176" class="lbl" font-size="9" fill="#58A6FF">▸</text>
    <text x="48" y="176" class="lbl" font-size="9" fill="#C9D1D9">RAG chatbot (Gemini + pgvector) · real-time WebSocket chat</text>
    <text x="36" y="191" class="lbl" font-size="9" fill="#58A6FF">▸</text>
    <text x="48" y="191" class="lbl" font-size="9" fill="#C9D1D9">Microservices architecture · Nginx proxy · CI/CD pipeline</text>
    <!-- Footer Link -->
