    <text x="494" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="504" y="143" class="lbl" font-size="8.5" fill="#A371F7">Gemini/GPT/Claude</text>
    <text x="604" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="614" y="143" class="lbl" font-size="8.5" fill="#E3B341">Tesseract</text>
    <text x="660" y="143" class="lbl" font-size="8.5" fill="#30363D"> · </text>
    <text x="670" y="143" class="lbl" font-size="8.5" fill="#3FB950">sklearn</text>
    <text x="448" y="167" class="lbl" font-size="9" fill="#FF7B72">▸</text>
    <text x="460" y="167" class="lbl" font-size="9" fill="#C9D1D9"><tspan fill="#58A6FF">96.7%</tspan> macro-avg accuracy · 5-fold CV (n=30)</text>
