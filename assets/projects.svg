    <text x="777" y="88.5" class="lbl" font-size="8" fill="#FF7B72" text-anchor="middle" font-weight="700">PRIVACY · AI · NLP</text>
    <text x="452" y="119" class="lbl" font-size="9" fill="#8B949E">Privacy-first LLM Message Classifier · On-device OCR/ASR</text>
    <rect x="452" y="126" width="372" height="20" rx="4" fill="#0D1117"/>
    <text x="460" y="139.5" class="lbl" font-size="8.5" fill="#FF7B72">Python · Gemini · Claude · Tesseract OCR · faster-whisper</text>
    <text x="452" y="161" class="lbl" font-size="9" fill="#FF7B72">▸</text>
    <text x="464" y="161" class="lbl" font-size="9" fill="#C9D1D9"><tspan fill="#FF7B72" font-weight="700">96.7%</tspan> macro-avg accuracy (5-fold CV) · on-device OCR/ASR</text>
    <text x="452" y="176" class="lbl" font-size="9" fill="#FF7B72">▸</text>
    <text x="464" y="176" class="lbl" font-size="9" fill="#C9D1D9">Sub-10ms TF-IDF/LR for prompt-injection &amp; phishing detection</text>
    <text x="452" y="191" class="lbl" font-size="9" fill="#FF7B72">▸</text>
    <text x="464" y="191" class="lbl" font-size="9" fill="#C9D1D9">Context compressed <tspan fill="#3FB950" font-weight="700">60–95%</tspan> before dispatching LLM calls</text>
