    <text x="460" y="331.5" class="lbl" font-size="8.5" fill="#A371F7">NLP · PyTorch · Transformers · AG News · Scaler Rethesis</text>
    <text x="452" y="353" class="lbl" font-size="9" fill="#A371F7">▸</text>
    <text x="464" y="353" class="lbl" font-size="9" fill="#C9D1D9">Augments Q/K projections with learnable <tspan fill="#A371F7" font-weight="700">higher-order moments</tspan></text>
    <text x="452" y="368" class="lbl" font-size="9" fill="#A371F7">▸</text>
    <text x="464" y="368" class="lbl" font-size="9" fill="#C9D1D9">Cross-Moment Projection (CMP) module with multi-seed validation</text>
    <text x="452" y="383" class="lbl" font-size="9" fill="#A371F7">▸</text>
    <text x="464" y="383" class="lbl" font-size="9" fill="#C9D1D9">Won <tspan fill="#FFA116" font-weight="700">2nd Prize 🥈</tspan> at Scaler Rethesis research symposium</text>
    <line x1="440" y1="420" x2="836" y2="420" stroke="#21262D" stroke-width="1"/>
    <text x="452" y="432" class="lbl" font-size="8.5" fill="#A371F7">⎋  Independent Research · Co-authored</text>
