    <circle cx="468" cy="277" r="3.5" fill="#FEBC2E" opacity="0.6"/>
    <circle cx="480" cy="277" r="3.5" fill="#28C840" opacity="0.6"/>
    <text x="496" y="281" class="lbl" font-size="12.5" font-weight="700" fill="#FFFFFF">🔬 MESA</text>
    <rect x="712" y="268" width="114" height="18" rx="4" fill="#281B3D" stroke="#A371F7" stroke-width="0.8"/>
    <text x="769" y="280.5" class="lbl" font-size="8" fill="#A371F7" text-anchor="middle" font-weight="700">RESEARCH · NLP · 2nd 🥈</text>
    <text x="452" y="311" class="lbl" font-size="9" fill="#8B949E">Moment Enriched Self Attention · Scaler Rethesis (2nd Prize)</text>
