<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
  <defs>
    <style>
      @keyframes fillBar { from { width: 0; } }
      @keyframes fadeIn  { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      .lbl { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .row { animation: fadeIn 0.5s ease both; }
      .r0  { animation-delay: 0.1s; } .r1 { animation-delay: 0.2s; }
      .r2  { animation-delay: 0.3s; } .r3 { animation-delay: 0.4s; }
      .r4  { animation-delay: 0.5s; } .r5 { animation-delay: 0.6s; }
      .r6  { animation-delay: 0.7s; } .r7 { animation-delay: 0.8s; }
    </style>
    <!-- Animated bar clip paths -->
    <clipPath id="cCommits"><rect x="0" y="0" height="10" width="0" rx="4"><animate attributeName="width" from="0" to="180" dur="1.1s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cStars">  <rect x="0" y="0" height="10" width="0" rx="4"><animate attributeName="width" from="0" to="21"  dur="1.0s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cRepos">  <rect x="0" y="0" height="10" width="0" rx="4"><animate attributeName="width" from="0" to="90"  dur="1.0s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cForks">  <rect x="0" y="0" height="10" width="0" rx="4"><animate attributeName="width" from="0" to="12"  dur="0.9s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>

    <clipPath id="cPy">  <rect x="0" y="0" height="8" width="0" rx="3"><animate attributeName="width" from="0" to="126" dur="1.0s" begin="0.3s"  fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cTs">  <rect x="0" y="0" height="8" width="0" rx="3"><animate attributeName="width" from="0" to="48"  dur="0.9s" begin="0.4s"  fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cJs">  <rect x="0" y="0" height="8" width="0" rx="3"><animate attributeName="width" from="0" to="24"  dur="0.8s" begin="0.5s"  fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cC">   <rect x="0" y="0" height="8" width="0" rx="3"><animate attributeName="width" from="0" to="24"  dur="0.8s" begin="0.6s"  fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
    <clipPath id="cOth"> <rect x="0" y="0" height="8" width="0" rx="3"><animate attributeName="width" from="0" to="6"   dur="0.7s" begin="0.7s"  fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/></rect></clipPath>
  </defs>

  <!-- Terminal chrome -->
  <rect width="860" height="230" rx="10" fill="#0D1117"/>
  <rect width="858" height="228" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="20" r="5.5" fill="#28C840"/>
  <text x="430" y="24" class="lbl" font-size="12" fill="#8B949E" text-anchor="middle">FierceAdder@github — $ gh stats --verbose</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1"/>

  <!-- Prompt line -->
  <text x="22" y="54" class="lbl" font-size="11" fill="#58A6FF" font-weight="600">FierceAdder@github</text>
  <text x="184" y="54" class="lbl" font-size="11" fill="#8B949E">:~$</text>
  <text x="210" y="54" class="lbl" font-size="11" fill="#3FB950" font-weight="600">gh api /users/FierceAdder/stats</text>

  <!-- ═══ LEFT COLUMN: Metric bars ═══ -->
  <!-- COMMITS -->
  <g class="row r0">
    <text x="22"  y="78" class="lbl" font-size="10" fill="#8B949E">COMMITS</text>
    <rect x="100" y="70" width="180" height="10" rx="4" fill="#21262D"/>
    <g transform="translate(100,70)"><rect width="180" height="10" rx="4" fill="#3FB950" clip-path="url(#cCommits)"/></g>
    <text x="286" y="79" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">  284</text>
  </g>
  <!-- STARS -->
  <g class="row r1">
    <text x="22"  y="100" class="lbl" font-size="10" fill="#8B949E">STARS</text>
    <rect x="100" y="92" width="180" height="10" rx="4" fill="#21262D"/>
    <g transform="translate(100,92)"><rect width="180" height="10" rx="4" fill="#E3B341" clip-path="url(#cStars)"/></g>
    <text x="286" y="101" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">    4</text>
  </g>
  <!-- REPOS -->
  <g class="row r2">
    <text x="22"  y="122" class="lbl" font-size="10" fill="#8B949E">REPOS</text>
    <rect x="100" y="114" width="180" height="10" rx="4" fill="#21262D"/>
    <g transform="translate(100,114)"><rect width="180" height="10" rx="4" fill="#58A6FF" clip-path="url(#cRepos)"/></g>
    <text x="286" y="123" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">   22</text>
  </g>
  <!-- FORKS -->
  <g class="row r3">
    <text x="22"  y="144" class="lbl" font-size="10" fill="#8B949E">FORKS</text>
    <rect x="100" y="136" width="180" height="10" rx="4" fill="#21262D"/>
    <g transform="translate(100,136)"><rect width="180" height="10" rx="4" fill="#A371F7" clip-path="url(#cForks)"/></g>
    <text x="286" y="145" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">    3</text>
  </g>

  <!-- Divider between metric groups -->
  <line x1="22" y1="156" x2="320" y2="156" stroke="#21262D" stroke-width="1"/>

  <!-- STREAK block -->
  <g class="row r4">
    <circle cx="30" cy="175" r="5" fill="#3FB950"/>
    <text x="42" y="179" class="lbl" font-size="10" fill="#C9D1D9">current streak</text>
    <text x="150" y="179" class="lbl" font-size="10" fill="#3FB950" font-weight="700"> — active</text>
  </g>
  <g class="row r5">
    <circle cx="30" cy="195" r="5" fill="none" stroke="#8B949E" stroke-width="1.5"/>
    <circle cx="30" cy="195" r="2" fill="#8B949E"/>
    <text x="42" y="199" class="lbl" font-size="10" fill="#C9D1D9">on GitHub since</text>
    <text x="174" y="199" class="lbl" font-size="10" fill="#8B949E" font-weight="700"> Jan 2024</text>
  </g>
  <g class="row r6">
    <text x="30" y="218" class="lbl" font-size="10" fill="#A371F7">✦</text>
    <text x="46" y="218" class="lbl" font-size="10" fill="#C9D1D9">LeetCode knight · rating</text>
    <text x="225" y="218" class="lbl" font-size="10" fill="#58A6FF" font-weight="700"> 2073</text>
  </g>

  <!-- ═══ VERTICAL DIVIDER ═══ -->
  <line x1="340" y1="45" x2="340" y2="220" stroke="#21262D" stroke-width="1"/>

  <!-- ═══ RIGHT COLUMN: Top Languages ═══ -->
  <text x="360" y="58" class="lbl" font-size="9" font-weight="800" fill="#58A6FF" letter-spacing="2">TOP LANGS</text>
  <line x1="455" y1="53" x2="838" y2="53" stroke="#21262D" stroke-width="1"/>

  <!-- Python 50% (9/18 non-HTML repos) -->
  <g class="row r0">
    <text x="360" y="78" class="lbl" font-size="10" fill="#3FB950">▸</text>
    <text x="376" y="78" class="lbl" font-size="10" fill="#8B949E">Python</text>
    <rect x="460" y="70" width="210" height="8" rx="3" fill="#21262D"/>
    <g transform="translate(460,70)"><rect width="210" height="8" rx="3" fill="#3776AB" clip-path="url(#cPy)"/></g>
    <text x="676" y="78" class="lbl" font-size="10" fill="#3776AB" font-weight="700"> 50%</text>
    <text x="716" y="78" class="lbl" font-size="9" fill="#30363D">▓▓▓▓▓▓▓▓▓▓</text>
  </g>
  <!-- TypeScript 19% -->
  <g class="row r1">
    <text x="360" y="100" class="lbl" font-size="10" fill="#3FB950">▸</text>
    <text x="376" y="100" class="lbl" font-size="10" fill="#8B949E">TypeScript</text>
    <rect x="460" y="92" width="210" height="8" rx="3" fill="#21262D"/>
    <g transform="translate(460,92)"><rect width="210" height="8" rx="3" fill="#3178C6" clip-path="url(#cTs)"/></g>
    <text x="676" y="100" class="lbl" font-size="10" fill="#3178C6" font-weight="700"> 19%</text>
  </g>
  <!-- JavaScript 10% -->
  <g class="row r2">
    <text x="360" y="122" class="lbl" font-size="10" fill="#3FB950">▸</text>
    <text x="376" y="122" class="lbl" font-size="10" fill="#8B949E">JavaScript</text>
    <rect x="460" y="114" width="210" height="8" rx="3" fill="#21262D"/>
    <g transform="translate(460,114)"><rect width="210" height="8" rx="3" fill="#F7DF1E" clip-path="url(#cJs)"/></g>
    <text x="676" y="122" class="lbl" font-size="10" fill="#F7DF1E" font-weight="700"> 10%</text>
  </g>
  <!-- C 10% -->
  <g class="row r3">
    <text x="360" y="144" class="lbl" font-size="10" fill="#3FB950">▸</text>
    <text x="376" y="144" class="lbl" font-size="10" fill="#8B949E">C</text>
    <rect x="460" y="136" width="210" height="8" rx="3" fill="#21262D"/>
    <g transform="translate(460,136)"><rect width="210" height="8" rx="3" fill="#A8B9CC" clip-path="url(#cC)"/></g>
    <text x="676" y="144" class="lbl" font-size="10" fill="#A8B9CC" font-weight="700"> 10%</text>
  </g>
  <!-- Other -->
  <g class="row r4">
    <text x="360" y="166" class="lbl" font-size="10" fill="#3FB950">▸</text>
    <text x="376" y="166" class="lbl" font-size="10" fill="#8B949E">Other</text>
    <rect x="460" y="158" width="210" height="8" rx="3" fill="#21262D"/>
    <g transform="translate(460,158)"><rect width="210" height="8" rx="3" fill="#8B949E" clip-path="url(#cOth)"/></g>
    <text x="676" y="166" class="lbl" font-size="10" fill="#8B949E" font-weight="700">  3%</text>
  </g>

  <!-- Stacked proportion bar -->
  <rect x="460" y="178" width="210" height="12" rx="4" fill="#21262D"/>
  <rect x="460" y="178" width="105" height="12" rx="4" fill="#3776AB" opacity="0.85"/>
  <rect x="565" y="178" width="40"  height="12" fill="#3178C6" opacity="0.85"/>
  <rect x="605" y="178" width="21"  height="12" fill="#F7DF1E" opacity="0.85"/>
  <rect x="626" y="178" width="21"  height="12" fill="#A8B9CC" opacity="0.85"/>
  <rect x="647" y="178" width="23"  height="12" rx="4" fill="#8B949E" opacity="0.5"/>

  <!-- Legend -->
  <circle cx="463" cy="203" r="4" fill="#3776AB"/><text x="472" y="207" class="lbl" font-size="8.5" fill="#8B949E">Py</text>
  <circle cx="496" cy="203" r="4" fill="#3178C6"/><text x="505" y="207" class="lbl" font-size="8.5" fill="#8B949E">TS</text>
  <circle cx="529" cy="203" r="4" fill="#F7DF1E"/><text x="538" y="207" class="lbl" font-size="8.5" fill="#8B949E">JS</text>
  <circle cx="562" cy="203" r="4" fill="#A8B9CC"/><text x="571" y="207" class="lbl" font-size="8.5" fill="#8B949E">C</text>
  <circle cx="595" cy="203" r="4" fill="#8B949E"/><text x="604" y="207" class="lbl" font-size="8.5" fill="#8B949E">Other</text>

  <!-- Repo count annotation -->
  <text x="360" y="207" class="lbl" font-size="9" fill="#30363D">──</text>
  <text x="376" y="207" class="lbl" font-size="9" fill="#8B949E" opacity="0.5">22 public repos · Jan 2024 →</text>

  <!-- Blinking cursor -->
  <rect x="818" y="208" width="8" height="12" rx="1" fill="#3FB950" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
