<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220">
  <defs>
    <style>
      .lbl { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes growBar {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      .anim-bar {
        transform-origin: left;
        animation: growBar 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .d0 { animation-delay: 0.10s; }
      .d1 { animation-delay: 0.18s; }
      .d2 { animation-delay: 0.26s; }
      .d3 { animation-delay: 0.34s; }
      .d4 { animation-delay: 0.42s; }
    </style>
    <clipPath id="langBarClip">
      <rect x="510" y="178" width="245" height="7" rx="3.5"/>
    </clipPath>
  </defs>

  <!-- Terminal Window Chrome -->
  <rect width="860" height="220" rx="10" fill="#0D1117"/>
  <rect width="858" height="218" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2"/>
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56"/>
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E"/>
  <circle cx="56" cy="20" r="5.5" fill="#28C840"/>
  <text x="430" y="24" class="lbl" font-size="11.5" fill="#8B949E" text-anchor="middle">FierceAdder@github — $ gh stats --verbose</text>
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1"/>

  <!-- ═══ LEFT COLUMN: Metrics ═══ -->
  <text x="24" y="56" class="lbl" font-size="8.5" fill="#58A6FF" font-weight="800" letter-spacing="2">METRICS</text>
  <line x1="88" y1="51" x2="380" y2="51" stroke="#21262D" stroke-width="1"/>

  <!-- COMMITS -->
  <g>
    <text x="24" y="74" class="lbl" font-size="10" fill="#8B949E">COMMITS</text>
    <rect x="110" y="66" width="200" height="9" rx="4.5" fill="#21262D"/>
    <rect x="110" y="66" width="150" height="9" rx="4.5" fill="#3FB950" class="anim-bar d0"/>
    <text x="320" y="74" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">299</text>
  </g>

  <!-- STARS -->
  <g>
    <text x="24" y="97" class="lbl" font-size="10" fill="#8B949E">STARS</text>
    <rect x="110" y="89" width="200" height="9" rx="4.5" fill="#21262D"/>
    <rect x="110" y="89" width="28" height="9" rx="4.5" fill="#E3B341" class="anim-bar d1"/>
    <text x="320" y="97" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">4</text>
  </g>

  <!-- REPOS -->
  <g>
    <text x="24" y="120" class="lbl" font-size="10" fill="#8B949E">REPOS</text>
    <rect x="110" y="112" width="200" height="9" rx="4.5" fill="#21262D"/>
    <rect x="110" y="112" width="115" height="9" rx="4.5" fill="#58A6FF" class="anim-bar d2"/>
    <text x="320" y="120" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">23</text>
  </g>

  <!-- FORKS -->
  <g>
    <text x="24" y="143" class="lbl" font-size="10" fill="#8B949E">FORKS</text>
    <rect x="110" y="135" width="200" height="9" rx="4.5" fill="#21262D"/>
    <rect x="110" y="135" width="24" height="9" rx="4.5" fill="#A371F7" class="anim-bar d3"/>
    <text x="320" y="143" class="lbl" font-size="10" fill="#C9D1D9" font-weight="700">3</text>
  </g>

  <!-- Info footer -->
  <line x1="24" y1="168" x2="380" y2="168" stroke="#21262D" stroke-width="1"/>
  <g>
    <circle cx="32" cy="188" r="5" fill="#3FB950"/>
    <text x="44" y="192" class="lbl" font-size="9.5" fill="#C9D1D9">On GitHub since <tspan fill="#8B949E">Jan 2024</tspan></text>
  </g>

  <!-- ═══ VERTICAL DIVIDER ═══ -->
  <line x1="395" y1="42" x2="395" y2="208" stroke="#21262D" stroke-width="1"/>

  <!-- ═══ RIGHT COLUMN: Top Languages ═══ -->
  <text x="415" y="56" class="lbl" font-size="8.5" fill="#58A6FF" font-weight="800" letter-spacing="2">TOP LANGUAGES</text>
  <line x1="538" y1="51" x2="836" y2="51" stroke="#21262D" stroke-width="1"/>

  <!-- Language Rows -->
  <g>
    <text x="415" y="74" class="lbl" font-size="10" fill="#3776AB">▸</text>
    <text x="429" y="74" class="lbl" font-size="10" fill="#C9D1D9">Python</text>
    <rect x="510" y="66" width="245" height="8" rx="4" fill="#21262D"/>
    <rect x="510" y="66" width="122" height="8" rx="4" fill="#3776AB" class="anim-bar d0"/>
    <text x="768" y="74" class="lbl" font-size="10" fill="#3776AB" font-weight="700">50%</text>
  </g>

  <g>
    <text x="415" y="97" class="lbl" font-size="10" fill="#3178C6">▸</text>
    <text x="429" y="97" class="lbl" font-size="10" fill="#C9D1D9">TypeScript</text>
    <rect x="510" y="89" width="245" height="8" rx="4" fill="#21262D"/>
    <rect x="510" y="89" width="49" height="8" rx="4" fill="#3178C6" class="anim-bar d1"/>
    <text x="768" y="97" class="lbl" font-size="10" fill="#3178C6" font-weight="700">20%</text>
  </g>

  <g>
    <text x="415" y="120" class="lbl" font-size="10" fill="#F7DF1E">▸</text>
    <text x="429" y="120" class="lbl" font-size="10" fill="#C9D1D9">JavaScript</text>
    <rect x="510" y="112" width="245" height="8" rx="4" fill="#21262D"/>
    <rect x="510" y="112" width="24" height="8" rx="4" fill="#F7DF1E" class="anim-bar d2"/>
    <text x="768" y="120" class="lbl" font-size="10" fill="#F7DF1E" font-weight="700">10%</text>
  </g>

  <g>
    <text x="415" y="143" class="lbl" font-size="10" fill="#A8B9CC">▸</text>
    <text x="429" y="143" class="lbl" font-size="10" fill="#C9D1D9">C</text>
    <rect x="510" y="135" width="245" height="8" rx="4" fill="#21262D"/>
    <rect x="510" y="135" width="24" height="8" rx="4" fill="#A8B9CC" class="anim-bar d3"/>
    <text x="768" y="143" class="lbl" font-size="10" fill="#A8B9CC" font-weight="700">10%</text>
  </g>

  <g>
    <text x="415" y="166" class="lbl" font-size="10" fill="#8B949E">▸</text>
    <text x="429" y="166" class="lbl" font-size="10" fill="#C9D1D9">Other</text>
    <rect x="510" y="158" width="245" height="8" rx="4" fill="#21262D"/>
    <rect x="510" y="158" width="24" height="8" rx="4" fill="#8B949E" class="anim-bar d4"/>
    <text x="768" y="166" class="lbl" font-size="10" fill="#8B949E" font-weight="700">10%</text>
  </g>

  <!-- Stacked language bar -->
  <g clip-path="url(#langBarClip)">
    <rect x="510" y="178" width="245" height="7" fill="#21262D"/>
    <rect x="510" y="178" width="124" height="7" fill="#3776AB"/> <rect x="634" y="178" width="49" height="7" fill="#3178C6"/> <rect x="683" y="178" width="24" height="7" fill="#F7DF1E"/> <rect x="707" y="178" width="24" height="7" fill="#A8B9CC"/> <rect x="731" y="178" width="24" height="7" fill="#8B949E"/>
  </g>

  <!-- Legend -->
  <circle cx="510" cy="198" r="3" fill="#3776AB"/><text x="516" y="201" class="lbl" font-size="8.5" fill="#8B949E">Py</text> <circle cx="540" cy="198" r="3" fill="#3178C6"/><text x="546" y="201" class="lbl" font-size="8.5" fill="#8B949E">TS</text> <circle cx="570" cy="198" r="3" fill="#F7DF1E"/><text x="576" y="201" class="lbl" font-size="8.5" fill="#8B949E">JS</text> <circle cx="600" cy="198" r="3" fill="#A8B9CC"/><text x="606" y="201" class="lbl" font-size="8.5" fill="#8B949E">C</text> <circle cx="624" cy="198" r="3" fill="#8B949E"/><text x="630" y="201" class="lbl" font-size="8.5" fill="#8B949E">Other</text>

  <!-- Blinking cursor -->
  <rect x="836" y="200" width="7" height="11" rx="1" fill="#3FB950" opacity="0.75">
    <animate attributeName="opacity" values="0.75;0;0.75" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>