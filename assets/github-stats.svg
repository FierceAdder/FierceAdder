<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
  <defs>
    <!-- Clip path for rounded bar ends -->
    <clipPath id="barClip-commits">
      <rect x="0" y="0" width="180" height="8" rx="4" />
    </clipPath>
    <clipPath id="barClip-stars">
      <rect x="0" y="0" width="180" height="8" rx="4" />
    </clipPath>
    <clipPath id="barClip-prs">
      <rect x="0" y="0" width="180" height="8" rx="4" />
    </clipPath>
    <clipPath id="barClip-issues">
      <rect x="0" y="0" width="180" height="8" rx="4" />
    </clipPath>
    <clipPath id="barClip-repos">
      <rect x="0" y="0" width="180" height="8" rx="4" />
    </clipPath>
    <clipPath id="barClip-py">
      <rect x="0" y="0" width="120" height="7" rx="3.5" />
    </clipPath>
    <clipPath id="barClip-js">
      <rect x="0" y="0" width="120" height="7" rx="3.5" />
    </clipPath>
    <clipPath id="barClip-ts">
      <rect x="0" y="0" width="120" height="7" rx="3.5" />
    </clipPath>
    <clipPath id="barClip-java">
      <rect x="0" y="0" width="120" height="7" rx="3.5" />
    </clipPath>
    <clipPath id="barClip-c">
      <rect x="0" y="0" width="120" height="7" rx="3.5" />
    </clipPath>
  </defs>

  <!-- Terminal window background -->
  <rect width="860" height="230" rx="10" fill="#0D1117" />
  <rect width="858" height="228" x="1" y="1" rx="10" fill="none" stroke="#30363D" stroke-width="1.2" />

  <!-- macOS traffic light dots -->
  <circle cx="22" cy="20" r="5.5" fill="#FF5F56" />
  <circle cx="39" cy="20" r="5.5" fill="#FEBC2E" />
  <circle cx="56" cy="20" r="5.5" fill="#28C840" />

  <!-- Title bar text -->
  <text x="430" y="24" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="12" fill="#8B949E" text-anchor="middle">FierceAdder@github — $ gh stats --verbose</text>

  <!-- Title bar bottom border -->
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363D" stroke-width="1" />

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEFT COLUMN: Metric bars                           -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Section header: METRICS -->
  <text x="22" y="54" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#58A6FF" letter-spacing="2" font-weight="600">METRICS</text>
  <line x1="78" y1="50" x2="454" y2="50" stroke="#21262D" stroke-width="1" />

  <!-- ── COMMITS ── -->
  <!-- Label -->
  <text x="22" y="74" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">COMMITS</text>
  <!-- Background bar -->
  <rect x="92" y="66" width="180" height="8" rx="4" fill="#21262D" />
  <!-- Fill bar group (clipped) -->
  <g transform="translate(92,66)" clip-path="url(#barClip-commits)">
    <rect x="0" y="0" width="0" height="8" rx="4" fill="#3FB950">
      <animate attributeName="width" from="0" to="180" dur="1.2s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <!-- Value -->
  <text x="282" y="74" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">1,247</text>

  <!-- ── STARS ── -->
  <text x="22" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">STARS   </text>
  <rect x="92" y="88" width="180" height="8" rx="4" fill="#21262D" />
  <g transform="translate(92,88)" clip-path="url(#barClip-stars)">
    <!-- 89/1247 ≈ 7.1% of max → scale relative to commits: 89/1247 * 180 ≈ 12.8px. 
         But visually we want a nicer spread. Using a soft log scale:
         commits=180, stars=~65, prs=~44, issues=~26, repos=~85 (scaled aesthetically) -->
    <rect x="0" y="0" width="0" height="8" rx="4" fill="#58A6FF">
      <animate attributeName="width" from="0" to="65" dur="1.2s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="282" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">89</text>

  <!-- ── PRs ── -->
  <text x="22" y="118" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">PRs     </text>
  <rect x="92" y="110" width="180" height="8" rx="4" fill="#21262D" />
  <g transform="translate(92,110)" clip-path="url(#barClip-prs)">
    <rect x="0" y="0" width="0" height="8" rx="4" fill="#3FB950">
      <animate attributeName="width" from="0" to="44" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="282" y="118" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">34</text>

  <!-- ── ISSUES ── -->
  <text x="22" y="140" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">ISSUES  </text>
  <rect x="92" y="132" width="180" height="8" rx="4" fill="#21262D" />
  <g transform="translate(92,132)" clip-path="url(#barClip-issues)">
    <rect x="0" y="0" width="0" height="8" rx="4" fill="#A371F7">
      <animate attributeName="width" from="0" to="26" dur="1.2s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="282" y="140" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">18</text>

  <!-- ── REPOS ── -->
  <text x="22" y="162" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">REPOS   </text>
  <rect x="92" y="154" width="180" height="8" rx="4" fill="#21262D" />
  <g transform="translate(92,154)" clip-path="url(#barClip-repos)">
    <rect x="0" y="0" width="0" height="8" rx="4" fill="#3FB950">
      <animate attributeName="width" from="0" to="85" dur="1.2s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="282" y="162" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">22</text>

  <!-- Divider between bars and streak -->
  <line x1="22" y1="176" x2="454" y2="176" stroke="#21262D" stroke-width="1" />

  <!-- ── STREAK section ── -->
  <!-- Section header -->
  <text x="22" y="192" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#58A6FF" letter-spacing="2" font-weight="600">STREAK</text>

  <!-- Current streak: filled circle ◉ -->
  <circle cx="72" cy="207" r="5" fill="#3FB950" />
  <circle cx="72" cy="207" r="3" fill="#0D1117" />
  <circle cx="72" cy="207" r="1.5" fill="#3FB950" />
  <text x="82" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#3FB950" font-weight="bold">12d</text>
  <text x="108" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">current</text>

  <!-- Longest streak: outlined circle ◎ -->
  <circle cx="174" cy="207" r="5" fill="none" stroke="#8B949E" stroke-width="1.5" />
  <circle cx="174" cy="207" r="2" fill="none" stroke="#8B949E" stroke-width="1" />
  <text x="184" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#C9D1D9" font-weight="bold">47d</text>
  <text x="210" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">longest</text>

  <!-- Since: star symbol ✦ -->
  <text x="276" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="13" fill="#A371F7">✦</text>
  <text x="291" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">since</text>
  <text x="326" y="211" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#A371F7" font-weight="bold">Jan 2024</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Vertical divider between columns                   -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="470" y1="43" x2="470" y2="222" stroke="#30363D" stroke-width="1" />

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RIGHT COLUMN: Top Languages                        -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Section header: TOP LANGS -->
  <text x="490" y="54" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#58A6FF" letter-spacing="2" font-weight="600">TOP LANGS</text>
  <line x1="558" y1="50" x2="840" y2="50" stroke="#21262D" stroke-width="1" />

  <!-- ── Python 42% ── -->
  <!-- Arrow glyph -->
  <text x="490" y="74" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#3FB950">▸</text>
  <!-- Language label -->
  <text x="503" y="74" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">Python    </text>
  <!-- Background bar -->
  <rect x="593" y="66" width="120" height="7" rx="3.5" fill="#21262D" />
  <!-- Fill bar: 42% of 120 = 50.4 -->
  <g transform="translate(593,66)" clip-path="url(#barClip-py)">
    <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#3FB950">
      <animate attributeName="width" from="0" to="50" dur="1.2s" begin="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <!-- Percentage -->
  <text x="722" y="74" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#3FB950" font-weight="bold">42%</text>

  <!-- ── JavaScript 28% ── -->
  <text x="490" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#58A6FF">▸</text>
  <text x="503" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">JavaScript</text>
  <rect x="593" y="88" width="120" height="7" rx="3.5" fill="#21262D" />
  <!-- 28% of 120 = 33.6 -->
  <g transform="translate(593,88)" clip-path="url(#barClip-js)">
    <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#58A6FF">
      <animate attributeName="width" from="0" to="34" dur="1.2s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="722" y="96" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#58A6FF" font-weight="bold">28%</text>

  <!-- ── TypeScript 15% ── -->
  <text x="490" y="118" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#A371F7">▸</text>
  <text x="503" y="118" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">TypeScript</text>
  <rect x="593" y="110" width="120" height="7" rx="3.5" fill="#21262D" />
  <!-- 15% of 120 = 18 -->
  <g transform="translate(593,110)" clip-path="url(#barClip-ts)">
    <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#A371F7">
      <animate attributeName="width" from="0" to="18" dur="1.2s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="722" y="118" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#A371F7" font-weight="bold">15%</text>

  <!-- ── Java 9% ── -->
  <text x="490" y="140" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#FEBC2E">▸</text>
  <text x="503" y="140" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">Java      </text>
  <rect x="593" y="132" width="120" height="7" rx="3.5" fill="#21262D" />
  <!-- 9% of 120 = 10.8 -->
  <g transform="translate(593,132)" clip-path="url(#barClip-java)">
    <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#FEBC2E">
      <animate attributeName="width" from="0" to="11" dur="1.2s" begin="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="722" y="140" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#FEBC2E" font-weight="bold">9%</text>

  <!-- ── C 6% ── -->
  <text x="490" y="162" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#FF5F56">▸</text>
  <text x="503" y="162" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#8B949E">C         </text>
  <rect x="593" y="154" width="120" height="7" rx="3.5" fill="#21262D" />
  <!-- 6% of 120 = 7.2 -->
  <g transform="translate(593,154)" clip-path="url(#barClip-c)">
    <rect x="0" y="0" width="0" height="7" rx="3.5" fill="#FF5F56">
      <animate attributeName="width" from="0" to="7" dur="1.2s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
    </rect>
  </g>
  <text x="722" y="162" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" fill="#FF5F56" font-weight="bold">6%</text>

  <!-- ── Stacked mini language bar at bottom of right column ── -->
  <line x1="490" y1="176" x2="840" y2="176" stroke="#21262D" stroke-width="1" />
  <text x="490" y="192" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#58A6FF" letter-spacing="2" font-weight="600">DISTRIBUTION</text>

  <!-- Stacked proportion bar: total width = 350px -->
  <!-- Python 42% = 147px -->
  <rect x="490" y="199" width="0" height="10" rx="0" fill="#3FB950">
    <animate attributeName="width" from="0" to="147" dur="1.2s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
  </rect>
  <!-- JS 28% = 98px, starts at 147 -->
  <rect x="637" y="199" width="0" height="10" fill="#58A6FF">
    <animate attributeName="width" from="0" to="98" dur="1.2s" begin="0.65s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
  </rect>
  <!-- TS 15% = 52.5px, starts at 245 -->
  <rect x="735" y="199" width="0" height="10" fill="#A371F7">
    <animate attributeName="width" from="0" to="53" dur="1.2s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
  </rect>
  <!-- Java 9% = 31.5px, starts at 297.5 -->
  <rect x="788" y="199" width="0" height="10" fill="#FEBC2E">
    <animate attributeName="width" from="0" to="31" dur="1.2s" begin="0.75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
  </rect>
  <!-- C 6% = 21px, starts at 329 -->
  <rect x="819" y="199" width="0" height="10" fill="#FF5F56">
    <animate attributeName="width" from="0" to="21" dur="1.2s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" />
  </rect>
  <!-- Round the left end -->
  <rect x="490" y="199" width="10" height="10" rx="5" fill="#3FB950" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.6s" fill="freeze" />
  </rect>
  <!-- Round the right end -->
  <rect x="830" y="199" width="10" height="10" rx="5" fill="#FF5F56" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="0.8s" fill="freeze" />
  </rect>

  <!-- Bottom legend dots -->
  <circle cx="494" cy="222" r="3" fill="#3FB950" />
  <text x="500" y="226" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#8B949E">Py</text>
  <circle cx="525" cy="222" r="3" fill="#58A6FF" />
  <text x="531" y="226" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#8B949E">JS</text>
  <circle cx="556" cy="222" r="3" fill="#A371F7" />
  <text x="562" y="226" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#8B949E">TS</text>
  <circle cx="587" cy="222" r="3" fill="#FEBC2E" />
  <text x="593" y="226" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#8B949E">Java</text>
  <circle cx="621" cy="222" r="3" fill="#FF5F56" />
  <text x="627" y="226" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="9" fill="#8B949E">C</text>

</svg>
